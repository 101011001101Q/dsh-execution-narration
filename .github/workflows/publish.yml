name: Publish to npm

# 通过 npm Trusted Publishing (OIDC) 发布 —— 本仓库不保存、也不需要任何长期 npm 令牌。
#
# 启用前提（只需做一次，在 npmjs.com 上）：
#   包页面 → Settings → Trusted Publisher → 选 GitHub Actions，填：
#     Organization or user : 101011001101Q
#     Repository           : dsh-execution-narration
#     Workflow filename    : publish.yml      （只写文件名，不含 .github/workflows/ 前缀）
#     Environment          : 留空
# 详见 README「自动发布」一节。
#
# 发布流程：先把 package.json 的 version 改好并提交 → 再在 GitHub 上创建 Release（打 tag）→ 本工作流发布。
# 也可以手动触发（workflow_dispatch）。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publishing (OIDC) 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing 要求 Node >= 22.14.0
          node-version: '24'

      # Trusted Publishing 要求 npm CLI >= 11.5.1；runner 自带版本可能偏低
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Show tool versions
        run: |
          node -v
          npm -v

      # 发布前先看清将要上传的内容，避免误发文件
      - name: Inspect the tarball
        run: npm pack --dry-run

      # npm 会凭 OIDC 自动换取短期凭据，并自动生成 provenance 证明
      - name: Publish
        run: npm publish
